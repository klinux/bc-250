name: BC-250 Local
version: 1.0.0
schema: v1

models:
  - name: Qwen3-Coder-30B (BC-250)
    provider: openai
    model: /models/Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated.i1-Q2_K.gguf
    apiBase: http://llm.fuseone.io/v1
    # provider "openai" exige o campo; o servidor nao valida (sem --api-key)
    apiKey: nao-usado
    defaultCompletionOptions:
      contextLength: 8192
      maxTokens: 4096
    # "agent" e o que habilita o modo Agent (tool calling). Sem ele o Continue
    # recusa a tarefa dizendo que precisa do modo agente.
    # Nada a ver com a flag --agent do llama-server, que e outra coisa.
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
      - agent

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: open
